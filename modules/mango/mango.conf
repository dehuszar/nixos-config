# ~/.config/mango/mango.conf
#
# Mangowm configuration — editable without a Nix rebuild.
# Changes take effect via:  mmsg dispatch reload_config
# Or automatically if the config watcher service is running.

# ── Source other config files ──────────────────────────────────────────
source = ~/.config/mango/noctalia.conf

# ──  Base Config

# ── Monitor Rules ──────────────────────────────────────────────────────
monitorrule = name:eDP-1,scale:1.25
monitorrule = name:DP-3,scale:1.2

# ── Blur & Shadows ─────────────────────────────────────────────────────
blur = 1
blur_layer = 1
blur_optimized = 1
blur_params_num_passes = 2
blur_params_radius = 5
blur_params_noise = 0.02
blur_params_brightness = 0.9
blur_params_contrast = 0.9
blur_params_saturation = 1.0
layer_animations = 0

shadows = 1
layer_shadows = 1
shadow_only_floating = 0
shadows_size = 4
shadows_blur = 12
shadows_position_x = 2
shadows_position_y = 2
shadowscolor = 0x000000ff

# ── Window Effects ─────────────────────────────────────────────────────
border_radius = 6
focused_opacity = 1.0
unfocused_opacity = 1.0
animations = 1
focus_cross_monitor = 1

# ── Window Rules ───────────────────────────────────────────────────────
windowrule = tags:9,title:^nvim$
windowrule = tags:9,title:^pi-sbx$
windowrule = tags:9,title:^shell$
no_radius_when_single = 1

# ── Keybindings ────────────────────────────────────────────────────────
# System
bind = SUPER,o,toggleoverview
bind = SUPER,comma,spawn,noctalia msg settings-toggle
bind = SUPER,s,spawn,noctalia msg panel-toggle control-center
bind = SUPER,space,spawn,noctalia msg panel-toggle launcher
bind = Super+SHIFT,f,togglefullscreen
bind = Super,g,toggleglobal
bind = SUPER,k,spawn,noctalia msg panel-toggle kenn/keybind-cheatsheet:cheatsheet
bind = Super,q,killclient
bind = Super+SHIFT,r,reload_config

# Workspace / tag switching (Super+1 through Super+9)
bind = Super,1,view,1,1
bind = Super,2,view,2,1
bind = Super,3,view,3,1
bind = Super,4,view,4,1
bind = Super,5,view,5,1
bind = Super,6,view,6,1
bind = Super,7,view,7,1
bind = Super,8,view,8,1
bind = Super,9,view,9,1

# Focus and Movement
bind = Alt,Tab,focuslast
bind = Super,Down,focusdir,down
bind = Super,Left,focusdir,left
bind = Super,Right,focusdir,right
bind = Super,Up,focusdir,up
bind = Super+SHIFT,Down,focus_window_or_workspace,down
bind = Super+SHIFT,Left,focus_window_or_workspace,left
bind = Super+SHIFT,Right,focus_window_or_workspace,right
bind = Super+SHIFT,Up,focus_window_or_workspace,up

# Layouts
bind = Super,F2,setlayout,scroller
bind = Super,F1,setlayout,tile

# Move focused window to tag (Super+Shift+1 through Super+Shift+9)
bind = SUPER+SHIFT,1,tag,1
bind = SUPER+SHIFT,2,tag,2
bind = SUPER+SHIFT,3,tag,3
bind = SUPER+SHIFT,4,tag,4
bind = SUPER+SHIFT,5,tag,5
bind = SUPER+SHIFT,6,tag,6
bind = SUPER+SHIFT,7,tag,7
bind = SUPER+SHIFT,8,tag,8
bind = SUPER+SHIFT,9,tag,9

# Move focused window to tag, but preserve current workspace (Super+Alt+1–9)
bind = SUPER+ALT,1,tagsilent,1
bind = SUPER+ALT,2,tagsilent,2
bind = SUPER+ALT,3,tagsilent,3
bind = SUPER+ALT,4,tagsilent,4
bind = SUPER+ALT,5,tagsilent,5
bind = SUPER+ALT,6,tagsilent,6
bind = SUPER+ALT,7,tagsilent,7
bind = SUPER+ALT,8,tagsilent,8
bind = SUPER+ALT,9,tagsilent,9

# Swap / reorder windows
bind = Super+ALT,Down,exchange_client,down
bind = Super+ALT,Left,exchange_client,left
bind = Super+ALT,Right,exchange_client,right
bind = Super+ALT,Up,exchange_client,up

# Move focused window to adjacent monitor (keep same tag)
bind = Super+CTRL,Down,tagmon,down,1
bind = Super+CTRL,Left,tagmon,left,1
bind = Super+CTRL,Right,tagmon,right,1
bind = Super+CTRL,Up,tagmon,up,1

# Resize mode (enters a submap for keyboard resizing)
bind = Super+CTRL,r,setkeymode,resize

# Mouse and keyboard
trackpad_natural_scrolling = 1
numlockon = 1

# Media keys
bind = NONE,XF86AudioRaiseVolume,spawn,noctalia msg volume-up
bind = NONE,XF86AudioLowerVolume,spawn,noctalia msg volume-down
bind = NONE,XF86AudioMute,spawn,noctalia msg volume-mute
bind = NONE,XF86MonBrightnessUp,spawn,noctalia msg brightness-up
bind = NONE,XF86MonBrightnessDown,spawn,noctalia msg brightness-down

# Screenshots
bind = NONE,Print,spawn,$HOME/.local/bin/screenshot fullscreen
bind = SHIFT,Print,spawn,$HOME/.local/bin/screenshot region
bind = CTRL+SHIFT,Print,spawn,$HOME/.local/bin/screenshot window
bind = CTRL+SUPER,Print,spawn,$HOME/.local/bin/screenshot freeze
bind = SHIFT+SUPER,Print,spawn,$HOME/.local/bin/screenshot freeze-region
bind = SUPER,Print,spawn,$HOME/.local/bin/screenshot annotate

# App launchers
bind = Super,Return,spawn,ghostty
bind = Super,b,spawn,bitwig-studio
bind = Super,o,spawn,obsidian
bind = Super,n,spawn,ghostty -e nvim
bind = Super,t,spawn,steam
bind = Super,x,spawn,firefox
bind = Super,y,spawn,ghostty -e yazi
bind = SUPER,z,spawn,/home/sam/.local/bin/nixos-config-spawn

# ── Resize keymode ─────────────────────────────────────────────────────
keymode = resize
bind = NONE,Left,resizewin,-10,0
bind = NONE,Right,resizewin,+10,0
bind = NONE,Up,resizewin,0,-10
bind = NONE,Down,resizewin,0,+10
bind = NONE,Escape,setkeymode,default
